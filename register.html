<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Configure the document and load the shared stylesheet. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="register-page">
  <!-- Shared navigation between the site's main pages. -->
  <div class="topnav">
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
        <a class="active" href="register.html" aria-current="page">Register</a>
        <a href="score.html">High Scores</a>
        <a href="game.html">Game</a>
        <a href="about.html">About</a>
        <a href="terms.html">Terms & Privacy</a>
    </div>
    <!-- Registration details and a live region for validation feedback. -->
    <section id="register"></section>
    <div class="container">
      <h1>Register</h1>
      <p>Please fill in this form to create an account.</p>
      <hr>
      <label for="email"><b>Email</b></label>
      <input type="email" placeholder="Enter Email" name="email" id="email" required>

      <label for="address"><b>Address</b></label>
      <input type="text" placeholder="Enter your address" name="address" id="address" autocomplete="street-address" required>

      <label for="postcode"><b>Postcode</b></label>
      <input type="text" placeholder="e.g. SW1A 1AA" name="postcode" id="postcode" autocomplete="postal-code" maxlength="8" required>

      <label for="phone"><b>Phone number</b></label>
      <input type="tel" placeholder="Enter your phone number" name="phone" id="phone" autocomplete="tel" required>

      <label for="psw"><b>Password</b></label>
      <input type="password" placeholder="Enter Password" name="psw" id="psw" required>

      <p>By creating an account you agree to our <a href="terms.html">Terms & Privacy</a>.</p>
      <button type="button" class="registerbtn" onclick="register()">Register</button>
      <p id="registerMessage" aria-live="polite"></p>
  </div>

  <!-- Link existing users to the login page. -->
  <div class="container signin">
    <p>Already have an account? <a href="login.html">Sign in</a>.</p>
  </div>    

   <footer>
        <p>&copy; 2026 Rayan Aljoubory. All rights reserved.</p>
    </footer>     

   <!-- Handles registration, login, and score display across the site. -->
   <script src="js/script.js"></script>
</body>
</html>
